<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="heartGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="headphoneGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(244, 114, 182, 0.3)" stroke-width="4"/>

  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(244, 114, 182, 0.12)" stroke-width="2"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="rgba(192, 132, 252, 0.18)" stroke-width="2" stroke-dasharray="10 8"/>

  <g transform="translate(256, 240) scale(1.35)">
    <!-- Headphone Arch (Top) -->
    <path d="M-80,25 C-80,-75 80,-75 80,25" fill="none" stroke="url(#headphoneGrad2)" stroke-width="18" stroke-linecap="round" filter="url(#glow2)"/>
    <path d="M-80,25 C-80,-75 80,-75 80,25" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Ear Cup -->
    <rect x="-95" y="10" width="28" height="56" rx="14" fill="url(#headphoneGrad2)"/>
    <rect x="-92" y="16" width="10" height="44" rx="5" fill="#ffffff" opacity="0.4"/>

    <!-- Right Ear Cup -->
    <rect x="67" y="10" width="28" height="56" rx="14" fill="url(#headphoneGrad2)"/>
    <rect x="82" y="16" width="10" height="44" rx="5" fill="#ffffff" opacity="0.4"/>

    <!-- Heart Symbol (Synchronized Love) -->
    <path d="M 0,65 
             C -3,-2 
               -52,-8 
               -52,22 
             C -52,48 
               -10,75 
               0,95 
             C 10,75 
               52,48 
               52,22 
             C 52,-8 
               3,-2 
               0,65 Z"
          fill="url(#heartGrad2)" filter="url(#glow2)"/>

    <!-- Musical Soundwaves inside Heart -->
    <rect x="-18" y="24" width="6" height="24" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="-6" y="16" width="6" height="40" rx="3" fill="#ffffff"/>
    <rect x="6" y="22" width="6" height="28" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="18" y="29" width="6" height="14" rx="3" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>